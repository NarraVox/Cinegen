name: ⚡ CineGen Release Protocol

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🎬 Compilar Executável & Publicar Release
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar Dependências de Build do Instalador
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pythonnet clr-loader requests

      - name: 🔨 Gerar Executável do Instalador (Setup_CineGen.exe)
        run: |
          python build_setup.py

      - name: 🗜️ Empacotar Código do CineGen (ZIP)
        shell: pwsh
        run: |
          $releaseZip = "CineGen_Studio_${{ github.ref_name }}.zip"
          Compress-Archive -Path "cinegen", "docs", "README.md", "RELEASE_NOTES.md", "requirements.txt", "setup_cinegen.bat", "cinegen_installer.py", "LICENSE", "NOTICE", "COPYRIGHT.md" -DestinationPath $releaseZip
          Write-Host "Pacote $releaseZip gerado com sucesso!"

      - name: 🚀 Criar GitHub Release e Publicar Executáveis
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ⚡ CineGen ${{ github.ref_name }} - "Autonomous AI Cinema Studio"
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/Setup_CineGen.exe
            CineGen_Studio_${{ github.ref_name }}.zip
            setup_cinegen.bat
            cinegen_installer.py
            requirements.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
